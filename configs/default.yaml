experiment:
  name: qalf_vaihingen
  output_dir: outputs/qalf_vaihingen
  seed: 42

dataset:
  name: vaihingen
  root_dir: data/Vaihingen_prepared_v4
  image_dir: images
  aux_dir: dsm
  mask_dir: masks
  split_dir: splits
  image_suffix: .png
  aux_suffix: .png
  mask_suffix: .png
  num_classes: 6
  input_size: 512
  train_split: train.txt
  val_split: val.txt
  test_split: test.txt
  missing_prob: 0.3
  degradation_prob: 0.5
  normalize_aux: true

model:
  in_channels_main: 3
  in_channels_aux: 1
  base_channels: 32
  decoder_channels: 128
  num_classes: 6
  dropout: 0.1

train:
  device: cuda
  epochs: 200
  batch_size: 8
  num_workers: 4
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  save_best_only: true
  amp: false

loss:
  ce_weight: 1.0
  dice_weight: 0.5
  feat_weight: 1.0
  pred_weight: 1.0
  boundary_weight: 0.2

eval:
  batch_size: 4
  num_workers: 2

experiment:
  name: qalf_smoke_test
  output_dir: outputs/qalf_smoke_test
  seed: 42

dataset:
  name: vaihingen_dummy
  root_dir: data/Vaihingen
  image_dir: images
  aux_dir: dsm
  mask_dir: masks
  split_dir: splits
  image_suffix: .png
  aux_suffix: .png
  mask_suffix: .png
  num_classes: 6
  input_size: 256
  train_split: train.txt
  val_split: val.txt
  test_split: test.txt
  missing_prob: 0.2
  degradation_prob: 0.3
  normalize_aux: true

model:
  in_channels_main: 3
  in_channels_aux: 1
  base_channels: 16
  decoder_channels: 64
  num_classes: 6
  dropout: 0.1

train:
  device: cpu
  epochs: 1
  batch_size: 2
  num_workers: 0
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  save_best_only: true
  amp: false

loss:
  ce_weight: 1.0
  dice_weight: 0.5
  feat_weight: 0.5
  pred_weight: 0.5
  boundary_weight: 0.0

eval:
  batch_size: 2
  num_workers: 0
